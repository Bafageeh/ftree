name: Deploy Shajara admin login screen
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-shajara-admin-mobile.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf %s "$KEY" | base64 -d > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy new login UI and verify Expo SDK58 types
        env:
          HOST: ${{ vars.SERVER_HOST }}
          PORT: ${{ vars.SERVER_PORT }}
          APP: ${{ vars.APP_PATH }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -P "$PORT" scaffold/mobile/src/lib/adminSession.ts "root@$HOST:/tmp/shajara-adminSession.ts"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -P "$PORT" scaffold/mobile/app/admin.tsx "root@$HOST:/tmp/shajara-admin-login.tsx"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -P "$PORT" scripts/enable_shajara_admin_mobile.py "root@$HOST:/tmp/enable_shajara_admin_mobile.py"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$PORT" "root@$HOST" "APP_PATH='$APP' python3 /tmp/enable_shajara_admin_mobile.py"
          echo 'SHAJARA_ADMIN_UI_VERIFIED'

# Retry with fallback insertion before About scroll footer when the template changes.

# Retry with an admin-only wrapper compatible with the current review screen.
