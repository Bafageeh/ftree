name: Confirm Shajara admin credentials fingerprint
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live-admin-credential.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf %s "$KEY" | base64 -d > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Confirm existing account uses the original private credential hash
        env:
          HOST: ${{ vars.SERVER_HOST }}
          PORT: ${{ vars.SERVER_PORT }}
          APP: ${{ vars.APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$PORT" "root@$HOST" "APP_PATH='$APP' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH/shajara-api"
          HASH_FINGERPRINT="$(php -r 'require getcwd()."/vendor/autoload.php"; $a=require getcwd()."/bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $h=Illuminate\Support\Facades\DB::table("shajara_admin_accounts")->where("username","admin")->value("password_hash"); if(!$h)exit(4); echo hash("sha256",$h);')"
          if [ "$HASH_FINGERPRINT" = "6034c49656cac5a355cab7fb35be0466425f327dacd4935b675eea9217a5499f" ]; then
            echo 'EXISTING_ADMIN_PASSWORD_MATCHES_PRIVATE_PROVISIONING'
          else
            echo 'EXISTING_ADMIN_PASSWORD_CHANGED_OR_DIFFERENT'
          fi
          REMOTE
