name: Publish latest genealogy workbook
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-genealogy-latest.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf %s "$KEY" | base64 -d > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Validate Excel privately
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/shj-env"
          "$RUNNER_TEMP/shj-env/bin/pip" install -q cryptography
          "$RUNNER_TEMP/shj-env/bin/python" scripts/decrypt_timestamped_genealogy_v13.py
      - name: Deploy and verify
        env:
          HOST: ${{ vars.SERVER_HOST }}
          PORT: ${{ vars.SERVER_PORT }}
          APP: ${{ vars.APP_PATH }}
        run: |
          set -euo pipefail
          cp scripts/import_timestamped_genealogy_v13.py "$RUNNER_TEMP/shajara_v13_patch_and_run.py"
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT" "$RUNNER_TEMP/shajara-v13.normalized.json" "$RUNNER_TEMP/shajara_v13_patch_and_run.py" scripts/apply_excel_v10_private.py "root@$HOST:/tmp/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" "root@$HOST" "APP_PATH='$APP' python3 /tmp/shajara_v13_patch_and_run.py"
          python3 - <<'PY'
          import json,urllib.request
          data=json.load(urllib.request.urlopen('https://shajara.pm.sa/api/v1/stats',timeout=25))
          assert data['total']==517 and data['connected_to_prophet']==517 and data['disconnected_from_prophet']==0, data
          print('PUBLISHED_AND_VERIFIED',data)
          PY

