name: Restore pm.sa tree home URL
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-tree-url.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Connect to server
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf %s "$KEY" | base64 -d > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Fix public entry point and verify
        env:
          HOST: ${{ vars.SERVER_HOST }}
          PORT: ${{ vars.SERVER_PORT }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -P "$PORT" scripts/redirect_pm_sa_tree_root.py "root@$HOST:/tmp/redirect_pm_sa_tree_root.py"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$PORT" "root@$HOST" "python3 /tmp/redirect_pm_sa_tree_root.py"
          python3 - <<'PY'
          import urllib.request
          for url in ['https://pm.sa/tree/','https://pm.sa/tree/?search=P003']:
              response=urllib.request.urlopen(url,timeout=30)
              text=response.read().decode('utf-8')
              assert 'id="tree-search"' in text
              assert 'id="tree-results"' in text
              if 'P003' in url: assert 'عبدالله المحجوب' in text
              print('WORKING_WEB',url,response.status,response.url)
          PY
