name: Shajara secure workbook v7 deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/shajara-v7-secure-deploy.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipient:
    name: Print public-only encryption recipient
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Derive SSH public key (never print secret)
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" | awk '{print "SHJ_PUBLIC_KEY=" $1 " " $2}'
          rm -f "$HOME/.ssh/id_ed25519"
